<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creador de Cartas - ToroHax</title>
    <link rel="icon" type="image/png" href="logo_torohax.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; background-color: #0a0a0a; color: white; margin: 0; padding: 0; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 5px;}
        ::-webkit-scrollbar-thumb { background: #ffe680; border-radius: 5px; border: 2px solid #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD342; }

        .carta-wrapper { display: flex; flex-wrap: wrap; width: 95%; max-width: 1200px; margin: 8vh auto 50px; gap: 40px; justify-content: center; align-items: flex-start; }
        
        .controles-box { flex: 1; min-width: 320px; max-width: 450px; background: rgba(15, 15, 15, 0.95); border: 1px solid #333; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .controles-box h3 { color: #FFD342; border-bottom: 2px solid #333; padding-bottom: 15px; margin-top: 0; text-transform: uppercase; text-align: center; letter-spacing: 1px;}
        
        .control-section { background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 10px; padding: 15px; margin-bottom: 20px;}
        .section-title { color: #bdc3c7; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #fff; font-weight: bold; font-size: 0.95rem;}
        
        .form-group select {
            width: 100%; padding: 12px 15px; font-size: 1rem; color: #fff; background-color: #1a1a1a;
            border: 1px solid #444; border-radius: 8px; outline: none; cursor: pointer; transition: 0.2s;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FFD342' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 15px center; background-size: 15px;
        }
        .form-group select option { background-color: #1a1a1a; color: #fff; padding: 12px; }
        .form-group select option:checked { background: linear-gradient(#005f73, #005f73) !important; background-color: #005f73 !important; color: white !important; }
        .form-group select option:hover { background: linear-gradient(#5dc8e8, #5dc8e8) !important; background-color: #5dc8e8 !important; color: #111 !important; }

        .form-group input[type="text"], .form-group input[type="number"] { width: 100%; background: #1a1a1a; border: 1px solid #444; color: white; padding: 12px 15px; border-radius: 8px; outline: none; transition: 0.2s; font-size: 1rem;}
        .form-group select:focus, .form-group input[type="text"]:focus { border-color: #5dc8e8; box-shadow: 0 0 10px rgba(93, 200, 232, 0.2);}

        .radio-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border: 1px solid #333;}
        .radio-label { display: flex; flex-direction: row; align-items: center; cursor: pointer; color: #fff; font-size: 0.95rem; font-weight: bold; line-height: 1; margin: 0; padding: 0;}
        .radio-label input[type="radio"] { cursor: pointer; accent-color: #FFD342; width: 18px; height: 18px; margin: 0 10px 0 0; flex-shrink: 0;}
        .radio-label span { display: inline-flex; align-items: center; }
        .radio-label.disabled { color: #555; cursor: not-allowed; }
        .radio-label.disabled input[type="radio"] { cursor: not-allowed; filter: grayscale(1); }

        .haxcolors-box { background: #b89947; border: 2px solid #8f7431; border-radius: 8px; padding: 15px; color: white; font-family: 'Arial', sans-serif; display: none; box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.4);}
        .hc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .hc-label { font-size: 0.95rem; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        .hc-combo-input { display: flex; align-items: center; border: 2px solid #fff; border-radius: 5px; height: 34px; overflow: hidden; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .hc-text-bg { width: 75px; height: 100%; border: none; outline: none; text-align: center; font-family: monospace; font-weight: bold; font-size: 1rem; color: white; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; text-transform: uppercase;}
        .hc-color-picker { width: 30px; height: 100%; border: none; padding: 0; cursor: pointer; background: transparent; border-left: 1px solid #ccc;}
        .hc-angle { width: 75px !important; height: 34px; padding: 5px !important; border: 2px solid #fff !important; outline: none; background: white !important; color: black !important; font-weight: bold; text-align: center; border-radius: 5px !important; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

        .btn-descargar { width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; border: none; background: #FFD342; color: #111; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .btn-descargar:hover { background: #ffdf73; box-shadow: 0 0 20px rgba(255, 211, 66, 0.4); transform: translateY(-2px); }
        
        .preview-container { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px;}
        
        .fifa-card { 
            position: relative; width: 320px; height: 480px; 
            font-family: 'Arial', sans-serif; 
            transition: all 0.5s ease;
            background-color: var(--border-col, transparent);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .card-gris { --bg-1: #4b4b4b; --bg-2: #2c2c2c; --border-col: #8c8c8c; color: #fff; }
        .card-bronce { --bg-1: #cd7f32; --bg-2: #8b4513; --border-col: #ffc28f; color: #fff; }
        .card-plata { --bg-1: #e0e0e0; --bg-2: #9e9e9e; --border-col: #ffffff; color: #111; }
        .card-oro { --bg-1: #ffe066; --bg-2: #aa8014; --border-col: #fff5ba; color: #222; }
        .card-leyenda { --bg-1: #ff007f; --bg-2: #00d4ff; --border-col: #ffffff; color: #fff; }

        .card-bg {
            position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; z-index: 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        .fifa-card.historico, .fifa-card.historico .card-bg {
            clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 82%, 50% 100%, 0 82%, 0 10%);
        }
        .fifa-card.historico .card-bg {
            background-image: 
                radial-gradient(circle at center top, rgba(255,255,255,0.4) 0%, transparent 60%),
                radial-gradient(rgba(0,0,0,0.15) 1.5px, transparent 1.5px),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-size: 100% 100%, 8px 8px, 100% 100%;
            background-repeat: no-repeat, repeat, no-repeat;
        }

        .fifa-card.temporada, .fifa-card.temporada .card-bg {
            clip-path: polygon(0 8%, 50% 0, 100% 8%, 100% 82%, 50% 100%, 0 82%);
        }
        .fifa-card.temporada .card-bg {
            background-image: 
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 20% 90%, rgba(255, 255, 255, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(255, 255, 255, 0.3) 0%, transparent 40%),
                linear-gradient(0deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .card-shine {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0) 100%);
            opacity: 0.7; pointer-events: none; z-index: 1;
        }

        .card-content {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .fifa-card.temporada .card-content { padding-top: 35px; }

        .card-top { display: flex; width: 100%; justify-content: space-between; align-items: flex-start; z-index: 2; margin-top: 5px;}
        .card-info-left { display: flex; flex-direction: column; align-items: center; width: 35%; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);}
        
        .card-ovr { font-size: 3.5rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
        .card-pos { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
        .card-rank { font-size: 1.5rem; margin-bottom: 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .card-logo { width: 35px; height: 35px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .card-avatar-container { width: 65%; display: flex; justify-content: center; position: relative; }

        .haxball-circle {
            width: 140px; height: 140px; border-radius: 50%; border: 4px solid #111;
            display: flex; justify-content: center; align-items: center;
            font-size: 4.5rem; font-weight: bold; color: white;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.6);
            text-transform: uppercase; margin-top: 10px; z-index: 2; text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        .fifa-card.exportando .haxball-circle {
            box-shadow: 0 10px 20px rgba(0,0,0,0.6) !important; 
        }

        .card-name { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; margin: 15px 0 5px 0; letter-spacing: 1px; z-index: 2; width: 100%; text-align: center; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);}
        .card-plata .card-name, .card-oro .card-name { border-bottom-color: rgba(0,0,0,0.2); }
        .card-gris .card-name, .card-bronce .card-name, .card-leyenda .card-name { border-bottom-color: rgba(255,255,255,0.3); }

        .card-stats { display: flex; flex-direction: column; width: 100%; padding: 0 15px; z-index: 2; margin-top: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);}
        .stats-grid { 
            display: flex; 
            justify-content: center; 
            width: 100%; 
            border-top: 1px solid rgba(0,0,0,0.1); 
            padding-top: 10px;
            gap: 15px;
        }
        .card-plata .stats-grid, .card-oro .stats-grid { border-top-color: rgba(0,0,0,0.2); }
        .card-gris .stats-grid, .card-bronce .stats-grid, .card-leyenda .stats-grid { border-top-color: rgba(255,255,255,0.3); }

        .stats-col { 
            display: flex; 
            flex-direction: column; 
            width: 110px;
            padding: 0; 
            gap: 8px;
        }
        .stats-divider { width: 2px; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.2), rgba(0,0,0,0)); }
        .card-plata .stats-divider, .card-oro .stats-divider { background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.3), rgba(0,0,0,0)); }
        .card-gris .stats-divider, .card-bronce .stats-divider, .card-leyenda .stats-divider { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0)); }

        .stat-item { 
            display: block;
            width: 100%;
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 5px;
        }

        .stat-val { 
            display: inline-block;
            font-weight: 900; 
            width: 40px; 
            text-align: right; 
            margin-right: 8px;
        }

        .stat-label { 
            display: inline-block;
            font-weight: bold; 
            opacity: 0.8; 
            width: 40px; 
            text-align: left; 
        }
        
        .stat-gk-wrapper { display: flex; justify-content: center; margin-top: 8px; width: 100%; }
        .stat-gk-wrapper .stat-item { justify-content: center; }

        .fifa-card.exportando {
            background-color: transparent !important;
            clip-path: none !important;
            box-shadow: none !important;
        }
        .fifa-card.exportando .card-bg {
            top: 0; left: 0; right: 0; bottom: 0;
            clip-path: none !important;
        }
    </style>
</head>
<body>
    <header></header>

    <main>
        <div class="carta-wrapper" style="display: none;" id="mainContent">
            
            <div class="controles-box">
                <h3><i class="fa-solid fa-wand-magic-sparkles"></i> Crea tu Carta</h3>

                <div class="control-section">
                    <div class="section-title"><i class="fa-solid fa-chart-simple"></i> Atributos</div>
                    <div class="form-group">
                        <label>Evaluación</label>
                        <select id="selModo" onchange="actualizarCarta()">
                            <option value="hist">Histórico (Carrera)</option>
                            <option value="temp">Temporada Actual</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Posición</label>
                        <select id="selPos" onchange="actualizarCarta()">
                            <option value="DEL">Delantero (DEL)</option>
                            <option value="MED">Mediocampista (MED)</option>
                            <option value="DEF">Defensa (DEF)</option>
                            <option value="GK">Arquero (GK)</option>
                        </select>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title"><i class="fa-solid fa-shirt"></i> Diseño de la Carta</div>
                    <div class="form-group">
                        <label>Diseño de la camiseta</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="kitMode" value="server" checked onchange="toggleKitMode()"> 
                                <span>Equipos del Servidor</span>
                            </label>
                            <label class="radio-label disabled" id="lblVipCustom">
                                <input type="radio" name="kitMode" value="custom" id="radioCustom" onchange="toggleKitMode()" disabled> 
                                <span><i class="fa-solid fa-gem" style="color: #FFD342; margin-right: 8px;"></i> Personalizado (VIP)</span>
                            </label>
                        </div>

                        <select id="selKit" onchange="actualizarCarta()">
                            <option value="ToroHax_home">ToroHax (Local)</option>
                            <option value="ToroHax_away">ToroHax (Visita)</option>
                        </select>

                        <div class="haxcolors-box" id="haxcolorsBox">
                            <div class="hc-row">
                                <span class="hc-label">angle</span>
                                <input type="number" id="hc_angle" class="hc-angle" value="60" oninput="actualizarCarta()">
                            </div>
                            <div class="hc-row">
                                <span class="hc-label">avatar text</span>
                                <div class="hc-combo-input">
                                    <input type="text" id="txtTextCol" class="hc-text-bg" value="FFFFFF" maxlength="6" style="background-color: #FFFFFF;" oninput="syncTextToBg('txtTextCol', 'colText'); actualizarCarta();">
                                    <input type="color" id="colText" class="hc-color-picker" value="#FFFFFF" oninput="syncBgToText('colText', 'txtTextCol'); actualizarCarta();">
                                </div>
                            </div>
                            <hr style="border: 1px solid #8f7431; margin: 15px 0;">
                            <div class="hc-row">
                                <span class="hc-label">color 1</span>
                                <div class="hc-combo-input">
                                    <input type="text" id="txtC1" class="hc-text-bg" value="0080FF" maxlength="6" style="background-color: #0080FF;" oninput="syncTextToBg('txtC1', 'colC1'); actualizarCarta();">
                                    <input type="color" id="colC1" class="hc-color-picker" value="#0080FF" oninput="syncBgToText('colC1', 'txtC1'); actualizarCarta();">
                                </div>
                            </div>
                            <div class="hc-row">
                                <span class="hc-label">color 2</span>
                                <div class="hc-combo-input">
                                    <input type="text" id="txtC2" class="hc-text-bg" value="004077" maxlength="6" style="background-color: #004077;" oninput="syncTextToBg('txtC2', 'colC2'); actualizarCarta();">
                                    <input type="color" id="colC2" class="hc-color-picker" value="#004077" oninput="syncBgToText('colC2', 'txtC2'); actualizarCarta();">
                                </div>
                            </div>
                            <div class="hc-row">
                                <span class="hc-label">color 3</span>
                                <div class="hc-combo-input">
                                    <input type="text" id="txtC3" class="hc-text-bg" value="002033" maxlength="6" style="background-color: #002033;" oninput="syncTextToBg('txtC3', 'colC3'); actualizarCarta();">
                                    <input type="color" id="colC3" class="hc-color-picker" value="#002033" oninput="syncBgToText('colC3', 'txtC3'); actualizarCarta();">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Texto del Avatar (Max 2)</label>
                        <input type="text" id="txtAvatar" maxlength="2" value="10" oninput="actualizarAvatarTexto()" placeholder="Ej: 10 o LM">
                    </div>
                </div>

                <button class="btn-descargar" onclick="descargarCarta()">
                    <i class="fa-solid fa-download"></i> Descargar Carta
                </button>
            </div>

            <div class="preview-container">
                <div class="fifa-card historico card-oro" id="cartaFifa">
                    <div class="card-bg"></div>
                    <div class="card-shine"></div>
                    
                    <div class="card-content">
                        <div class="card-top">
                            <div class="card-info-left">
                                <div class="card-ovr" id="c_ovr">99</div>
                                <div class="card-pos" id="c_pos">DEL</div>
                                <div class="card-rank" id="c_rank" title="Rango Toro">🐂</div>
                                <img src="logo_torohax.png" class="card-logo" alt="ToroHax">
                            </div>
                            
                            <div class="card-avatar-container">
                                <div class="haxball-circle" id="c_avatar">10</div>
                            </div>
                        </div>

                        <div class="card-name" id="c_name">Nick</div>

                        <div class="card-stats">
                            <div class="stats-grid">
                                <div class="stats-col">
                                    <div class="stat-item"><span class="stat-val" id="s_tir">99</span> <span class="stat-label">TIR</span></div>
                                    <div class="stat-item"><span class="stat-val" id="s_pas">99</span> <span class="stat-label">PAS</span></div>
                                </div>
                                <div class="stats-divider"></div>
                                <div class="stats-col">
                                    <div class="stat-item"><span class="stat-val" id="s_hab">99</span> <span class="stat-label">HAB</span></div>
                                    <div class="stat-item"><span class="stat-val" id="s_def">99</span> <span class="stat-label">DEF</span></div>
                                </div>
                            </div>
                            <div class="stat-gk-wrapper">
                                <div class="stat-item"><span class="stat-val" id="s_gk">99</span> <span class="stat-label">GK</span></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <footer><p>© 2026 ToroHax. Todos los derechos reservados.</p></footer>

    <script src="header.js"></script>
    <script src="sidebar.js"></script>

    <script>
        const COLORS = {
            blanco:        0xFFFFFF, negro:         0x000000, gris:          0x7d7d7d,
            blanco_opaco:  0xbab8b8, blanco_crema:  0xFFFEE8, rojo:          0xCC2A2A,
            azul:          0x2656c7, celeste:       0x5dc8e8, azul_claro:    0x5D8AA8,
            azul_oscuro:   0x0a2445, celeste_claro: 0xADFFFF, granate:       0x6B1A1A,
            amarillo:      0xF7D738, dorado:        0xFFD342, dorado_oscuro: 0xD3A778,
            rosa:          0xFF69B4, rosa_claro:    0xFFABE3, verde:         0x00BA00,
            verde_oscuro:  0x23703C, verde_claro:   0x2ECC71, naranja:       0xE07000,
            morado:        0x8B45BA, azul_morado:   0x374B99, celeste_opaco: 0x95DBDB
        };

        const KIT_COLORS = [
            { name: "U. Católica", home: { colors: [COLORS.blanco, COLORS.azul, COLORS.blanco], text: COLORS.rojo, angle: 90 }, away: { colors: [COLORS.azul, COLORS.rojo, COLORS.rojo], text: COLORS.blanco, angle: 90 } },
            { name: "U. De Chile", home: { colors: [0x132A61, COLORS.azul, COLORS.azul], text: COLORS.rojo, angle: 70 }, away: { colors: [COLORS.azul, COLORS.blanco, COLORS.blanco], text: COLORS.rojo, angle: 50 } },
            { name: "Colo-Colo", home: { colors: [COLORS.blanco, COLORS.blanco, COLORS.negro], text: COLORS.negro, angle: 90 }, away: { colors: [0x191919, 0x121212, COLORS.negro], text: COLORS.rojo, angle: 60 } },
            { name: "U. Española", home: { colors: [COLORS.rojo, COLORS.rojo, COLORS.azul], text: COLORS.amarillo, angle: 90 }, away: { colors: [0x212121, COLORS.negro, 0x212121], text: COLORS.amarillo, angle: 0 } },
            { name: "Cobreloa", home: { colors: [0xF77B00, COLORS.naranja, 0xC96500], text: COLORS.blanco, angle: 60 }, away: { colors: [COLORS.negro, 0x0F0F0F, 0x141414], text: COLORS.naranja, angle: 60 } },

        let playerData = null;

        window.onload = () => {
            const loggedId = localStorage.getItem('toroHaxLoggedId');
            if (!loggedId) {
                alert("Debes iniciar sesión para crear tu carta.");
                window.location.href = "login.html";
                return;
            }

            fetch(`https://torobot-izu5.onrender.com/get-player/${loggedId}`)
            .then(res => res.json())
            .then(data => {
                if(data.name) {
                    playerData = data;
                    document.getElementById('mainContent').style.display = 'flex';
                    
                    if (data.isVip) {
                        const lblVip = document.getElementById('lblVipCustom');
                        const radioCustom = document.getElementById('radioCustom');
                        lblVip.classList.remove('disabled');
                        radioCustom.disabled = false;
                    }

                    llenarSelectKits();
                    document.getElementById('c_name').innerText = data.name.substring(0, 15);
                    actualizarCarta();
                }
            });
        };

        function syncBgToText(idColor, idText) {
            let col = document.getElementById(idColor).value.toUpperCase();
            let txt = document.getElementById(idText);
            txt.value = col.replace('#', '');
            txt.style.backgroundColor = col;
        }

        function syncTextToBg(idText, idColor) {
            let txt = document.getElementById(idText);
            let hex = txt.value.trim().toUpperCase();
            if (/^[0-9A-F]{6}$/i.test(hex)) {
                document.getElementById(idColor).value = '#' + hex;
                txt.style.backgroundColor = '#' + hex;
            }
        }

        function numToHex(num) {
            return "#" + num.toString(16).padStart(6, '0').toUpperCase();
        }

        function llenarSelectKits() {
            const select = document.getElementById('selKit');
            KIT_COLORS.forEach((kit, i) => {
                if (kit.name === "ToroHax") return;
                select.innerHTML += `<option value="${i}_home">${kit.name} (Local)</option>`;
                select.innerHTML += `<option value="${i}_away">${kit.name} (Visita)</option>`;
            });
        }

        function toggleKitMode() {
            const mode = document.querySelector('input[name="kitMode"]:checked').value;
            const selKit = document.getElementById('selKit');
            const hcBox = document.getElementById('haxcolorsBox');

            if (mode === 'server') {
                selKit.style.display = 'block';
                hcBox.style.display = 'none';
            } else {
                selKit.style.display = 'none';
                hcBox.style.display = 'block';
            }
            actualizarCarta();
        }

        function manejarKits() {
            const mode = document.querySelector('input[name="kitMode"]:checked').value;
            
            if (mode === 'custom') {
                dibujarAvatarHaxball(
                    document.getElementById('colC1').value,
                    document.getElementById('colC2').value,
                    document.getElementById('colC3').value,
                    document.getElementById('hc_angle').value,
                    document.getElementById('colText').value
                );
            } else {
                const val = document.getElementById('selKit').value;
                let kitTarget;
                if (val === "ToroHax_home") kitTarget = KIT_COLORS.find(k => k.name === "ToroHax").home;
                else if (val === "ToroHax_away") kitTarget = KIT_COLORS.find(k => k.name === "ToroHax").away;
                else {
                    const parts = val.split('_');
                    const kitObj = KIT_COLORS[parseInt(parts[0])];
                    kitTarget = parts[1] === 'home' ? kitObj.home : kitObj.away;
                }

                dibujarAvatarHaxball(
                    numToHex(kitTarget.colors[0]), 
                    numToHex(kitTarget.colors[1]), 
                    numToHex(kitTarget.colors[2]), 
                    kitTarget.angle, 
                    numToHex(kitTarget.text)
                );
            }
        }

        function dibujarAvatarHaxball(c1, c2, c3, angleHax, textCol) {
            const avatar = document.getElementById('c_avatar');
            const cssAngle = (parseInt(angleHax) || 0) + 90;
            avatar.style.background = `linear-gradient(${cssAngle}deg, ${c1} 33.3%, ${c2} 33.3% 66.6%, ${c3} 66.6%)`;
            avatar.style.color = textCol;
        }

        function actualizarAvatarTexto() {
            document.getElementById('c_avatar').innerText = document.getElementById('txtAvatar').value || " ";
        }

        function getRankEmoji(elo, partidos) {
            if (partidos < 10) return "⛔";
            const e = elo || 200;
            if (e < 360) return "🐓";
            if (e < 810) return "🦙";
            if (e < 1400) return "🐑";
            if (e < 2150) return "🐖";
            if (e < 3050) return "🐄";
            if (e < 3950) return "🐎";
            if (e < 5000) return "🐃";
            return "🐂";
        }

        function actualizarCarta() {
            if (!playerData) return;

            const isTemp = document.getElementById('selModo').value === 'temp';
            const pos = document.getElementById('selPos').value;

            const p_partidos = isTemp ? (playerData.temp_partidos || 0) : (playerData.partidos || 0);
            const p_goles = isTemp ? (playerData.temp_golesAnotados || 0) : (playerData.golesAnotados || 0);
            const p_asist = isTemp ? (playerData.temp_asistencias || 0) : (playerData.asistencias || 0);
            const p_ataj = isTemp ? (playerData.temp_atajadas || 0) : (playerData.atajadas || 0);
            const p_int = isTemp ? (playerData.temp_intercepciones || 0) : (playerData.intercepciones || 0);
            const p_pts = isTemp ? (playerData.temp_puntajeTotal || 0) : (playerData.puntajeTotal || 0);
            const p_pasC = isTemp ? (playerData.temp_pasesCompletados || 0) : (playerData.pasesCompletados || 0);
            const p_pasP = isTemp ? (playerData.temp_pasesPerdidos || 0) : (playerData.pasesPerdidos || 0);
            
            const elo = playerData.elo || 200;
            
            const calcScale = (val, max) => {
                let ratio = Math.min(1, Math.max(0, val / max));
                let curved = Math.pow(ratio, 0.45);
                return Math.min(99, Math.round(curved * 98 + 1));
            };

            const golesPP = p_partidos > 0 ? p_goles / p_partidos : 0;
            const TIR = calcScale(golesPP, 2.0);

            const asistPP = p_partidos > 0 ? p_asist / p_partidos : 0;
            const calcAsist = calcScale(asistPP, 1.0);
            const totalPases = p_pasC + p_pasP;
            const prec = totalPases > 0 ? p_pasC / totalPases : 0;
            const calcPrec = calcScale(prec, 1.0);
            const PAS = Math.round((calcAsist * 0.6) + (calcPrec * 0.4));

            const ptsPP = p_partidos > 0 ? p_pts / p_partidos : 0;
            const HAB = calcScale(ptsPP, 300);

            const defPP = p_partidos > 0 ? p_int / p_partidos : 0;
            const DEF = calcScale(defPP, 30.0);

            const gkPP = p_partidos > 0 ? p_ataj / p_partidos : 0;
            const GK = calcScale(gkPP, 5.0);

            let OVR = 1;
            if (pos === "DEL") OVR = Math.round(TIR*0.6 + PAS*0.2 + HAB*0.15 + DEF*0.05);
            else if (pos === "MED") OVR = Math.round(TIR*0.2 + PAS*0.4 + HAB*0.3 + DEF*0.1);
            else if (pos === "DEF") OVR = Math.round(TIR*0.02 + PAS*0.13 + HAB*0.05 + DEF*0.8);
            else if (pos === "GK") OVR = GK;

            let boost = 0;
            if (p_partidos >= 10) { 
                if (elo < 360) boost = 0;        
                else if (elo < 810) boost = 1;   
                else if (elo < 1400) boost = 2;  
                else if (elo < 2150) boost = 3;  
                else if (elo < 3050) boost = 4;  
                else if (elo < 3950) boost = 5;  
                else if (elo < 5000) boost = 6;  
                else boost = 7;                  
            }

            OVR += boost;
            if (OVR > 99) OVR = 99; 

            document.getElementById('s_tir').innerText = TIR;
            document.getElementById('s_pas').innerText = PAS;
            document.getElementById('s_hab').innerText = HAB;
            document.getElementById('s_def').innerText = DEF;
            document.getElementById('s_gk').innerText = GK;

            document.getElementById('c_ovr').innerText = OVR;
            document.getElementById('c_pos').innerText = pos;
            document.getElementById('c_rank').innerText = getRankEmoji(elo, p_partidos);

            const cartaDOM = document.getElementById('cartaFifa');
            
            cartaDOM.className = "fifa-card";
            if (isTemp) {
                cartaDOM.classList.add("temporada");
            } else {
                cartaDOM.classList.add("historico");
            }
            
            if (OVR <= 49) { cartaDOM.classList.add("card-gris"); cartaDOM.style.setProperty('--bg-1', '#4b4b4b'); cartaDOM.style.setProperty('--bg-2', '#2c2c2c'); cartaDOM.style.setProperty('--border-col', '#8c8c8c'); }
            else if (OVR <= 69) { cartaDOM.classList.add("card-bronce"); cartaDOM.style.setProperty('--bg-1', '#cd7f32'); cartaDOM.style.setProperty('--bg-2', '#8b4513'); cartaDOM.style.setProperty('--border-col', '#ffc28f');}
            else if (OVR <= 79) { cartaDOM.classList.add("card-plata"); cartaDOM.style.setProperty('--bg-1', '#e0e0e0'); cartaDOM.style.setProperty('--bg-2', '#9e9e9e'); cartaDOM.style.setProperty('--border-col', '#ffffff');}
            else if (OVR <= 89) { cartaDOM.classList.add("card-oro"); cartaDOM.style.setProperty('--bg-1', '#ffe066'); cartaDOM.style.setProperty('--bg-2', '#aa8014'); cartaDOM.style.setProperty('--border-col', '#fff5ba');}
            else { cartaDOM.classList.add("card-leyenda"); cartaDOM.style.setProperty('--bg-1', '#ff007f'); cartaDOM.style.setProperty('--bg-2', '#00d4ff'); cartaDOM.style.setProperty('--border-col', '#ffffff');}

            manejarKits();
        }

        function descargarCarta() {
            const btn = document.querySelector('.btn-descargar');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...';
            btn.disabled = true;

            const cartaElement = document.getElementById('cartaFifa');
            cartaElement.classList.add('exportando');

            htmlToImage.toCanvas(cartaElement, {
                pixelRatio: 3,
                backgroundColor: 'rgba(0,0,0,0)'
            }).then(canvas => {
                cartaElement.classList.remove('exportando');
                
                const pad = 24; 
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = canvas.width + (pad * 2);
                finalCanvas.height = canvas.height + (pad * 2);
                const ctx = finalCanvas.getContext('2d');

                const isTemp = document.getElementById('selModo').value === 'temp';
                const w = canvas.width;
                const h = canvas.height;

                ctx.translate(pad, pad);

                ctx.beginPath();
                if (isTemp) {
                    ctx.moveTo(0, h * 0.08);
                    ctx.lineTo(w * 0.5, 0);
                    ctx.lineTo(w, h * 0.08);
                    ctx.lineTo(w, h * 0.82);
                    ctx.lineTo(w * 0.5, h);
                    ctx.lineTo(0, h * 0.82);
                } else {
                    ctx.moveTo(w * 0.1, 0);
                    ctx.lineTo(w * 0.9, 0);
                    ctx.lineTo(w, h * 0.1);
                    ctx.lineTo(w, h * 0.82);
                    ctx.lineTo(w * 0.5, h);
                    ctx.lineTo(0, h * 0.82);
                    ctx.lineTo(0, h * 0.1);
                }
                ctx.closePath();

                ctx.save();
                ctx.clip();
                ctx.drawImage(canvas, 0, 0);
                ctx.restore();

                const borderCol = getComputedStyle(cartaElement).getPropertyValue('--border-col').trim();
                ctx.strokeStyle = borderCol || '#ffffff';
                ctx.lineWidth = 14; 
                ctx.lineJoin = 'miter'; 
                ctx.stroke();

                const link = document.createElement('a');
                link.download = `Carta_ToroHax_${playerData.name.replace(/\s+/g, '_')}.png`;
                link.href = finalCanvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch(err => {
                cartaElement.classList.remove('exportando');
                console.error(err);
                alert("Hubo un error al generar la imagen. Inténtalo desde un PC.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
