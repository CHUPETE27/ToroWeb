<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TNG2QC64');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulaciones - ToroHax</title>
    <link rel="icon" type="image/png" href="logo_torohax.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (!localStorage.getItem('toroHaxLoggedId') || !localStorage.getItem('toroHaxToken')) window.location.href = 'login.html';
    </script>
    <style>
        * { box-sizing: border-box; }
        .periodo-estado { text-align: center; margin: 0 0 16px; font-weight: bold; }
        .periodo-tipos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 15px; }
        .periodo-interruptor { display: flex; justify-content: center; margin-bottom: 16px; font-size: 1.05rem; color: #fff; }
        #btnGuardarPeriodo { margin: 5px auto 0; }
        .periodo-fechas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 600px) { .periodo-tipos, .periodo-fechas { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TNG2QC64"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header></header>

    <!-- Estilos: styles.css, sección 18. Permisos: los revisa bot.js; aquí solo se esconde lo que no aplica -->
    <main class="post-wrapper">
        <h1 class="post-titulo"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i> Postulaciones</h1>

        <div class="box post-centro" id="secCargando">
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <p>Verificando permisos...</p>
        </div>

        <div class="box post-centro" id="secBloqueado" hidden>
            <i class="fa-solid fa-ban" aria-hidden="true"></i>
            <h3>Acceso restringido</h3>
            <p id="textoBloqueado">Esta sección es solo para administradores de ToroHax.</p>
            <a href="index.html" class="btn-estandar btn-abrir"><i class="fa-solid fa-house" aria-hidden="true"></i> Volver al inicio</a>
        </div>

        <div class="box" id="secPeriodo" hidden>
            <h3>Periodo de postulaciones</h3>
            <p class="periodo-estado" id="periodoEstado"></p>
            <label class="th-option periodo-interruptor"><input type="checkbox" id="pAbierta"> Postulaciones abiertas</label>
            <div class="periodo-tipos" id="pTipos"></div>
            <div class="periodo-fechas">
                <div class="form-group">
                    <label for="pInicio">Inicio</label>
                    <input type="datetime-local" id="pInicio">
                </div>
                <div class="form-group">
                    <label for="pFin">Fin</label>
                    <input type="datetime-local" id="pFin">
                </div>
            </div>
            <button type="button" class="btn-estandar btn-abrir" id="btnGuardarPeriodo"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar</button>
        </div>

        <div class="box" id="secLista" hidden>
            <h3>Postulantes</h3>
            <div class="post-filtros">
                <div class="form-group">
                    <label for="fEstado">Estado</label>
                    <select id="fEstado">
                        <option value="pendiente">Pendientes</option>
                        <option value="aceptada">Aceptadas</option>
                        <option value="rechazada">Rechazadas</option>
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fTipo">Rol</label>
                    <select id="fTipo"><option value="">Todos</option></select>
                </div>
            </div>
            <ul class="post-lista" id="lista"></ul>
        </div>
    </main>

    <div class="modal-overlay post-modal" id="modalDetalle">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="dNick">
            <i class="fa-solid fa-xmark close-modal" id="cerrarDetalle" role="button" tabindex="0" aria-label="Cerrar"></i>
            <h3 id="dNick"></h3>
            <div class="post-datos">
                <span class="post-estado" id="dEstado"></span>
                <span>ID: <strong id="dId"></strong></span>
                <span><i class="fa-brands fa-discord" aria-hidden="true"></i> <strong id="dDiscord"></strong></span>
                <span>Rol: <strong id="dTipo"></strong></span>
                <span>Edad: <strong id="dEdad"></strong></span>
                <span>Enviada: <strong id="dFecha"></strong></span>
            </div>
            <div class="post-bloque">
                <h4>Motivo</h4>
                <p class="post-texto" id="dMotivo"></p>
            </div>
            <div class="post-bloque">
                <h4>Experiencia</h4>
                <p class="post-texto" id="dExperiencia"></p>
            </div>

            <hr class="post-separador">
            <div class="post-bloque">
                <h4>Votos <span class="post-votos" id="dConteo"></span></h4>
                <div class="post-votar" id="dVotar">
                    <button type="button" class="favor" data-valor="1"><i class="fa-solid fa-thumbs-up" aria-hidden="true"></i> A favor</button>
                    <button type="button" class="contra" data-valor="-1"><i class="fa-solid fa-thumbs-down" aria-hidden="true"></i> En contra</button>
                </div>
                <ul class="post-votantes" id="dVotantes"></ul>
            </div>

            <div class="post-bloque" id="dResuelta" hidden>
                <hr class="post-separador">
                <h4>Resolución</h4>
                <p class="post-texto" id="dResueltaTexto"></p>
            </div>

            <div id="dResolver" hidden>
                <hr class="post-separador">
                <div class="form-group">
                    <label for="dMensaje">Mensaje para el postulante (opcional)</label>
                    <textarea id="dMensaje" maxlength="500" rows="3"></textarea>
                    <div class="post-contador" data-de="dMensaje"></div>
                </div>
                <div class="post-acciones">
                    <button type="button" class="btn-estandar btn-primary" id="btnAceptar" style="background: var(--mint);"><i class="fa-solid fa-check" aria-hidden="true"></i> Aceptar</button>
                    <button type="button" class="btn-estandar btn-danger" id="btnRechazar"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Rechazar</button>
                </div>
            </div>

            <hr class="post-separador">
            <div class="post-bloque">
                <h4>Comentarios</h4>
                <ul class="post-hilo" id="dHilo"></ul>
                <form id="formComentario" hidden>
                    <div class="form-group">
                        <label for="dComentario">Comentario para el postulante</label>
                        <textarea id="dComentario" maxlength="500" rows="3" required></textarea>
                        <div class="post-contador" data-de="dComentario"></div>
                    </div>
                    <button type="submit" class="btn-estandar btn-primary" id="btnComentar"><i class="fa-solid fa-comment" aria-hidden="true"></i> Comentar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="torohax-ui.js"></script>
    <script src="header.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const API = 'https://torobot-izu5.onrender.com/api/postulaciones';
        const loggedId = localStorage.getItem('toroHaxLoggedId');
        const token = localStorage.getItem('toroHaxToken');
        const sesion = `numericId=${encodeURIComponent(loggedId)}&token=${encodeURIComponent(token)}`;
        const ROL_AUTOR = { admin_lider: 'Admin Líder', owner: 'Owner', postulante: 'Postulante' };
        const ESTADO = { pendiente: 'Pendiente', aceptada: 'Aceptada', rechazada: 'Rechazada' };
        const NIVEL = { usuario: 0, admin: 1, admin_lider: 2, owner: 3 };
        const fecha = f => f ? new Date(f).toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
        // datetime-local trabaja en hora local sin zona; el servidor guarda ISO
        const aLocal = iso => { if (!iso) return ''; const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
        const aIso = v => v ? new Date(v).toISOString() : null;
        let rol = 'usuario', tipos = {}, detalle = null;

        const mostrar = (...ids) => ['secCargando', 'secBloqueado', 'secPeriodo', 'secLista'].forEach(s => { document.getElementById(s).hidden = !ids.includes(s); });
        const esLider = () => NIVEL[rol] >= NIVEL.admin_lider;

        async function api(ruta, metodo = 'GET', cuerpo) {
            const r = await fetch(API + ruta + (metodo === 'GET' ? (ruta.includes('?') ? '&' : '?') + sesion : ''), metodo === 'GET' ? undefined : {
                method: metodo, headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numericId: loggedId, token, ...cuerpo })
            });
            const d = await r.json().catch(() => ({ success: false, message: 'Respuesta inválida del servidor.' }));
            if (r.status === 401) window.location.href = 'login.html';
            return d;
        }

        document.querySelectorAll('.post-contador').forEach(c => {
            const t = document.getElementById(c.dataset.de);
            const pintar = () => { c.textContent = `${t.value.length} / ${t.maxLength}`; c.classList.toggle('lleno', t.value.length >= t.maxLength); };
            t.addEventListener('input', pintar);
            pintar();
        });

        // ----- Periodo (Admin Líder y Owner) -----
        function pintarPeriodo(c) {
            const ahora = Date.now();
            const estado = document.getElementById('periodoEstado');
            if (c.activa) { estado.textContent = `🟢 Activas hasta el ${fecha(c.fechaFin)}`; estado.style.color = 'var(--mint)'; }
            else if (c.abierta && c.fechaInicio && new Date(c.fechaInicio) > ahora) { estado.textContent = `🟡 Programadas: abren el ${fecha(c.fechaInicio)}`; estado.style.color = 'var(--gold)'; }
            else if (c.abierta) { estado.textContent = '🟠 Abiertas, pero la fecha de fin ya pasó'; estado.style.color = 'var(--gold)'; }
            else { estado.textContent = '🔴 Cerradas'; estado.style.color = 'var(--red-light)'; }
            document.getElementById('pAbierta').checked = !!c.abierta;
            document.querySelectorAll('#pTipos input').forEach(i => { i.checked = (c.tiposAbiertos || []).includes(i.value); });
            document.getElementById('pInicio').value = aLocal(c.fechaInicio);
            document.getElementById('pFin').value = aLocal(c.fechaFin);
        }

        document.getElementById('btnGuardarPeriodo').addEventListener('click', async () => {
            const btn = document.getElementById('btnGuardarPeriodo');
            btn.disabled = true;
            try {
                const d = await api('/config', 'PUT', {
                    abierta: document.getElementById('pAbierta').checked,
                    tiposAbiertos: [...document.querySelectorAll('#pTipos input:checked')].map(i => i.value),
                    fechaInicio: aIso(document.getElementById('pInicio').value),
                    fechaFin: aIso(document.getElementById('pFin').value)
                });
                if (d.success) { pintarPeriodo(d.config); ThUI.alert('✅ Periodo guardado.'); }
                else ThUI.alert('❌ ' + (d.message || 'No se pudo guardar.'));
            } catch (e) { ThUI.alert('❌ No se pudo conectar con el servidor.'); }
            btn.disabled = false;
        });

        // ----- Lista -----
        function celda(clase, texto) { const s = document.createElement('span'); s.className = clase; s.textContent = texto; return s; }
        function votos(p) {
            const s = document.createElement('span');
            s.className = 'post-votos';
            s.append(celda('mas', '+' + p.votosPositivos), ' / ', celda('menos', '-' + p.votosNegativos));
            return s;
        }
        const estadoChip = estado => celda('post-estado ' + estado, ESTADO[estado] || estado);
        function filaVacia(texto) { const li = document.createElement('li'); li.className = 'vacio'; li.textContent = texto; return li; }

        async function cargarLista() {
            const ul = document.getElementById('lista');
            ul.innerHTML = '<li class="vacio"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</li>';
            const q = new URLSearchParams({ estado: document.getElementById('fEstado').value, tipo: document.getElementById('fTipo').value });
            try {
                const d = await api('?' + q);
                ul.replaceChildren();
                if (!d.success) return ul.appendChild(filaVacia(d.message || 'No se pudo cargar la lista.'));
                const cab = document.createElement('li');
                const fc = document.createElement('div');
                fc.className = 'post-fila cabecera';
                fc.append(...['Nick', 'ID', 'Discord', 'Rol', 'Estado', 'Votos'].map(t => celda('', t)));
                cab.appendChild(fc);
                ul.appendChild(cab);
                if (!d.postulaciones.length) return ul.appendChild(filaVacia('No hay postulaciones con este filtro.'));
                for (const p of d.postulaciones) {
                    const li = document.createElement('li');
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'post-fila';
                    b.append(celda('nick', p.nick), celda('id', '#' + p.numericId), celda('dc', p.discordUser || '—'), celda('tipo', p.tipoNombre), estadoChip(p.estado), votos(p));
                    b.addEventListener('click', () => abrirDetalle(p.id));
                    li.appendChild(b);
                    ul.appendChild(li);
                }
            } catch (e) {
                ul.replaceChildren(filaVacia('No se pudo conectar con el servidor.'));
            }
        }
        document.getElementById('fEstado').addEventListener('change', cargarLista);
        document.getElementById('fTipo').addEventListener('change', cargarLista);

        // ----- Detalle -----
        function pintarHilo(ul, comentarios) {
            ul.replaceChildren();
            if (!comentarios.length) return ul.appendChild(filaVacia('Todavía no hay comentarios.'));
            for (const c of comentarios) {
                const li = document.createElement('li');
                li.className = 'post-comentario ' + c.rolAutor;
                const cab = document.createElement('div');
                cab.className = 'post-comentario-cab';
                const nick = document.createElement('strong');
                nick.textContent = c.autorNick;
                cab.append(nick, celda('post-comentario-rol', ROL_AUTOR[c.rolAutor] || ''), celda('', fecha(c.fecha)));
                const p = document.createElement('p');
                p.textContent = c.texto;
                li.append(cab, p);
                ul.appendChild(li);
            }
        }

        function pintarVotos(p) {
            const conteo = document.getElementById('dConteo');
            conteo.replaceChildren(votos(p));
            const propia = p.numericId === parseInt(loggedId);
            document.querySelectorAll('#dVotar button').forEach(b => {
                b.classList.toggle('activo', Number(b.dataset.valor) === p.miVoto);
                b.disabled = p.estado !== 'pendiente' || propia;
                b.title = propia ? 'No puedes votar tu propia postulación' : (Number(b.dataset.valor) === p.miVoto ? 'Clic para quitar tu voto' : '');
            });
            const ul = document.getElementById('dVotantes');
            ul.replaceChildren();
            for (const v of p.votos || []) {
                const li = document.createElement('li');
                li.className = (v.valor === 1 ? 'favor' : 'contra') + (v.adminId === parseInt(loggedId) ? ' mio' : '');
                li.textContent = `${v.valor === 1 ? '👍' : '👎'} ${v.nick}${v.adminId === parseInt(loggedId) ? ' (tú)' : ''}`;
                ul.appendChild(li);
            }
        }

        function pintarDetalle(p) {
            detalle = p;
            document.getElementById('dNick').textContent = p.nick;
            const estado = document.getElementById('dEstado');
            estado.className = 'post-estado ' + p.estado;
            estado.textContent = ESTADO[p.estado] || p.estado;
            document.getElementById('dId').textContent = '#' + p.numericId;
            document.getElementById('dDiscord').textContent = p.discordUser || p.discordId || '—';
            document.getElementById('dTipo').textContent = p.tipoNombre;
            document.getElementById('dEdad').textContent = p.edad;
            document.getElementById('dFecha').textContent = fecha(p.fechaCreacion);
            document.getElementById('dMotivo').textContent = p.motivo;
            document.getElementById('dExperiencia').textContent = p.experiencia;
            pintarVotos(p);
            const resuelta = p.estado !== 'pendiente';
            document.getElementById('dResuelta').hidden = !resuelta;
            document.getElementById('dResueltaTexto').textContent = resuelta
                ? `${ESTADO[p.estado]} por ${p.resueltoPor ? p.resueltoPor.nick : '—'} el ${fecha(p.fechaResolucion)}.` + (p.mensaje ? `\nMensaje: ${p.mensaje}` : '')
                : '';
            const propia = p.numericId === parseInt(loggedId);
            document.getElementById('dResolver').hidden = resuelta || !esLider() || propia;
            document.getElementById('dMensaje').value = '';
            document.getElementById('dMensaje').dispatchEvent(new Event('input'));
            pintarHilo(document.getElementById('dHilo'), p.comentarios || []);
            document.getElementById('formComentario').hidden = !esLider() || propia;
        }

        async function abrirDetalle(id) {
            const modal = document.getElementById('modalDetalle');
            try {
                const d = await api('/' + encodeURIComponent(id));
                if (!d.success) return ThUI.alert('❌ ' + (d.message || 'No se pudo abrir la postulación.'));
                pintarDetalle(d.postulacion);
                modal.style.display = 'flex';
                modal.querySelector('.modal-content').scrollTop = 0;
            } catch (e) { ThUI.alert('❌ No se pudo conectar con el servidor.'); }
        }
        function cerrarDetalle() { document.getElementById('modalDetalle').style.display = 'none'; detalle = null; }
        document.getElementById('cerrarDetalle').addEventListener('click', cerrarDetalle);
        document.getElementById('cerrarDetalle').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') cerrarDetalle(); });
        document.getElementById('modalDetalle').addEventListener('mousedown', e => { if (e.target.id === 'modalDetalle') cerrarDetalle(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && detalle && !document.querySelector('.th-dialog-overlay')) cerrarDetalle(); });

        document.querySelectorAll('#dVotar button').forEach(b => b.addEventListener('click', async () => {
            if (!detalle) return;
            const valor = Number(b.dataset.valor) === detalle.miVoto ? 0 : Number(b.dataset.valor);
            document.querySelectorAll('#dVotar button').forEach(x => { x.disabled = true; });
            try {
                const d = await api(`/${encodeURIComponent(detalle.id)}/voto`, 'POST', { valor });
                if (!d.success) ThUI.alert('❌ ' + (d.message || 'No se pudo votar.'));
                const r = await api('/' + encodeURIComponent(detalle.id));   // la lista de votantes actualizada
                if (r.success) pintarDetalle(r.postulacion);
                cargarLista();
            } catch (e) { ThUI.alert('❌ No se pudo conectar con el servidor.'); pintarVotos(detalle); }
        }));

        async function resolver(estado) {
            if (!detalle) return;
            const texto = estado === 'aceptada' ? `¿Aceptar a ${detalle.nick} como ${detalle.tipoNombre}?` : `¿Rechazar la postulación de ${detalle.nick}?`;
            if (!await ThUI.confirm(texto + ' Se le avisará al postulante y no se puede deshacer.', { title: estado === 'aceptada' ? 'Aceptar postulación' : 'Rechazar postulación', okText: estado === 'aceptada' ? 'Aceptar' : 'Rechazar', danger: estado === 'rechazada' })) return;
            try {
                const d = await api(`/${encodeURIComponent(detalle.id)}/resolver`, 'POST', { estado, mensajeOpcional: document.getElementById('dMensaje').value.trim() });
                if (!d.success) return ThUI.alert('❌ ' + (d.message || 'No se pudo resolver.'));
                const r = await api('/' + encodeURIComponent(detalle.id));
                if (r.success) pintarDetalle(r.postulacion);
                cargarLista();
                ThUI.alert(estado === 'aceptada' ? '✅ Postulación aceptada.' : '✅ Postulación rechazada.');
            } catch (e) { ThUI.alert('❌ No se pudo conectar con el servidor.'); }
        }
        document.getElementById('btnAceptar').addEventListener('click', () => resolver('aceptada'));
        document.getElementById('btnRechazar').addEventListener('click', () => resolver('rechazada'));

        document.getElementById('formComentario').addEventListener('submit', async ev => {
            ev.preventDefault();
            const campo = document.getElementById('dComentario');
            const texto = campo.value.trim();
            if (!texto || !detalle) return;
            const btn = document.getElementById('btnComentar');
            btn.disabled = true;
            try {
                const d = await api(`/${encodeURIComponent(detalle.id)}/comentarios`, 'POST', { texto });
                if (!d.success) ThUI.alert('❌ ' + (d.message || 'No se pudo comentar.'));
                else { campo.value = ''; campo.dispatchEvent(new Event('input')); detalle.comentarios = d.comentarios; pintarHilo(document.getElementById('dHilo'), d.comentarios); }
            } catch (e) { ThUI.alert('❌ No se pudo conectar con el servidor.'); }
            btn.disabled = false;
        });

        // ----- Inicio -----
        (async () => {
            try {
                const e = await api('/estado');
                if (!e.success) throw new Error(e.message);
                if (e.sesionInvalida) return (window.location.href = 'login.html');
                rol = e.rol || 'usuario';
                if (NIVEL[rol] < NIVEL.admin) return mostrar('secBloqueado');
                tipos = e.tipos || {};
                const sel = document.getElementById('fTipo');
                const caja = document.getElementById('pTipos');
                for (const [t, nombre] of Object.entries(tipos)) {
                    const o = document.createElement('option');
                    o.value = t; o.textContent = nombre;
                    sel.appendChild(o);
                    const l = document.createElement('label');
                    l.className = 'th-option';
                    const i = document.createElement('input');
                    i.type = 'checkbox'; i.value = t;
                    l.append(i, ' ' + nombre);
                    caja.appendChild(l);
                }
                if (esLider()) { pintarPeriodo(e); mostrar('secPeriodo', 'secLista'); }
                else mostrar('secLista');
                await cargarLista();
                const id = new URLSearchParams(location.search).get('id');   // owner.html abre la ficha directo
                if (id) abrirDetalle(id);
            } catch (err) {
                document.getElementById('textoBloqueado').textContent = 'No se pudo conectar con el servidor. Inténtalo de nuevo en unos minutos.';
                mostrar('secBloqueado');
            }
        })();
    </script>
    <script src="scanner.js"></script>
</body>
</html>
